name: alarm

on:
  repository_dispatch:
    types: [play_alarm]

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:
          persist-credentials: true

      - name: Update state

        run: |

          echo "play $(date +%s)" > state.txt

      - name: Commit and Push

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add state.txt

          git commit -m "alarm update" || exit 0

          git push
